<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mão como mouse</title>
<style>
:root{--bg:#f3f5f4;--fg:#15211c;--mut:#5d6b64;--card:#fff;--acc:#0a7d5a;--line:#cfd8d3}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--fg:#e8efec;--mut:#92a29a;--card:#19211e;--acc:#3ecf9b;--line:#2c3834}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.bar{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar .sp{flex:1;min-width:0}
#st{color:var(--mut);font-size:.9rem;margin:0}
button{font:inherit;font-weight:600;padding:0 18px;min-height:56px;border:2px solid var(--acc);border-radius:12px;background:var(--card);color:var(--fg);display:flex;align-items:center;gap:8px}
button.hot{background:var(--acc);color:#fff}
#sw{width:18px;height:18px;border-radius:50%;background:#e4572e}
#v{width:84px;height:63px;object-fit:cover;border-radius:8px;transform:scaleX(-1);background:#000}
#play{position:relative;flex:0 0 26%;border-bottom:1px solid var(--line)}
.blk{position:absolute;top:18%;width:68px;height:68px;border-radius:12px;border:2px solid var(--fg)}
.blk.hot{outline:3px solid var(--acc)}
#cv{flex:1;min-height:0;width:100%;background:var(--card)}
#cur{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid var(--acc);border-radius:50%;pointer-events:none;display:none;z-index:9;background:rgba(10,125,90,0)}
#cur.on{background:var(--acc);transform:scale(.7)}
#intro{position:fixed;inset:0;background:var(--bg);display:grid;place-content:center;gap:14px;text-align:center;padding:24px;z-index:20}
#intro p{margin:0;color:var(--mut);max-width:34ch}
#intro button{justify-content:center;background:var(--acc);color:#fff}
</style>
</head>
<body>
<div class="bar">
  <button id="cnt">Contar: 0</button>
  <button id="col"><span id="sw"></span>Trocar cor</button>
  <button id="clr">Limpar</button>
  <div class="sp"><p id="st">Mova a mão na frente da câmera.</p></div>
  <video id="v" playsinline muted></video>
</div>
<div id="play">
  <div class="blk" id="b1" style="left:8%;background:#e4572e"></div>
  <div class="blk" id="b2" style="left:28%;background:#2e86e4"></div>
  <div class="blk" id="b3" style="left:48%;background:#f2b134"></div>
</div>
<canvas id="cv"></canvas>
<div id="cur"></div>
<div id="intro">
  <h1 style="margin:0;font-size:1.4rem">Mão como mouse</h1>
  <p>Mova a mão para guiar o cursor. Una o polegar e o indicador para clicar, arrastar e desenhar.</p>
  <button id="go">Ligar câmera</button>
  <p id="ist"></p>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const $=id=>document.getElementById(id);
const v=$("v"),cur=$("cur"),cv=$("cv"),ctx=cv.getContext("2d"),play=$("play"),st=$("st");
const colors=["#e4572e","#2e86e4","#f2b134","#17a398","#8a4fff"];
let ci=0,count=0;
$("sw").style.background=colors[0];
$("cnt").onclick=()=>{$("cnt").lastChild.textContent="Contar: "+(++count)};
$("col").onclick=()=>{ci=(ci+1)%colors.length;$("sw").style.background=colors[ci]};
$("clr").onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
function sizeCanvas(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d}
addEventListener("resize",sizeCanvas);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
let cx=0,cy=0,seen=false,pin=false,drag=null,drawing=false,lp=null,hotEl=null;
function press(){
  pin=true;cur.classList.add("on");
  const el=document.elementFromPoint(cx,cy);
  const b=el&&el.closest("button"),k=el&&el.closest(".blk");
  if(b)b.click();
  else if(k){const r=k.getBoundingClientRect(),p=play.getBoundingClientRect();drag={k,dx:cx-r.left,dy:cy-r.top,p}}
  else if(el===cv){drawing=true;lp=null}
}
function release(){pin=false;drag=null;drawing=false;lp=null;cur.classList.remove("on")}
function move(){
  if(drag){
    const {k,dx,dy,p}=drag;
    k.style.left=clamp(cx-dx-p.left,0,p.width-k.offsetWidth)+"px";
    k.style.top=clamp(cy-dy-p.top,0,p.height-k.offsetHeight)+"px";
  }else if(drawing){
    const r=cv.getBoundingClientRect(),s=cv.width/r.width;
    const x=(cx-r.left)*s,y=(cy-r.top)*s;
    ctx.strokeStyle=colors[ci];ctx.lineWidth=6*s;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(lp?lp.x:x,lp?lp.y:y);ctx.lineTo(x,y);ctx.stroke();
    lp={x,y};
  }
}
function hover(){
  const el=document.elementFromPoint(cx,cy);
  const t=el&&(el.closest("button")||el.closest(".blk"));
  if(t!==hotEl){if(hotEl)hotEl.classList.remove("hot");if(t)t.classList.add("hot");hotEl=t}
}
function onHand(h){
  const W=v.videoWidth,H=v.videoHeight;
  const P=l=>({x:l.x*W,y:l.y*H}),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const ratio=D(P(h[4]),P(h[8]))/D(P(h[0]),P(h[9]));
  const mx=1-(h[4].x+h[8].x)/2,my=(h[4].y+h[8].y)/2;
  const tx=clamp((mx-.2)/.6)*innerWidth,ty=clamp((my-.15)/.6)*innerHeight;
  if(!seen){cx=tx;cy=ty;seen=true;cur.style.display="block"}
  const d=Math.hypot(tx-cx,ty-cy),a=Math.min(.9,.12+d/200);
  cx+=(tx-cx)*a;cy+=(ty-cy)*a;
  cur.style.transform=`translate(${cx}px,${cy}px)${pin?" scale(.7)":""}`;
  if(!pin&&ratio<.3)press();else if(pin&&ratio>.5)release();
  if(pin)move();
  hover();
  st.textContent=pin?"Pinça: clicando":"Mão detectada";
}
async function mk(fs){
  const f=d=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numHands:1});
  try{return await f("GPU")}catch(e){return await f("CPU")}
}
$("go").onclick=async()=>{
  const ist=$("ist"),go=$("go");go.disabled=true;
  try{
    ist.textContent="Abrindo a câmera…";
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
    await v.play();
    ist.textContent="Carregando o modelo de mão…";
    const lm=await mk(await FilesetResolver.forVisionTasks(BASE));
    $("intro").style.display="none";sizeCanvas();
    let last=-1;
    const loop=()=>{
      if(v.videoWidth&&v.currentTime!==last){
        last=v.currentTime;
        const h=lm.detectForVideo(v,performance.now()).landmarks[0];
        if(h)onHand(h);
        else{seen=false;cur.style.display="none";if(pin)release();st.textContent="Nenhuma mão detectada."}
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    ist.textContent="Erro: "+(e.message||e)+". Verifique a permissão da câmera e a internet.";
    go.disabled=false;
  }
};
</script>
</body>
</html>
