<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de rastreamento de mão</title>
<style>
:root{--bg:#f3f5f4;--fg:#15211c;--mut:#5d6b64;--card:#fff;--acc:#0a7d5a;--trk:#dfe5e2}
@media (prefers-color-scheme:dark){:root{--bg:#101614;--fg:#e8efec;--mut:#92a29a;--card:#19211e;--acc:#3ecf9b;--trk:#2a3531}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:0 auto;display:grid;gap:14px}
h1{font-size:1.3rem;margin:0}
.cam{position:relative;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
button{font:inherit;font-weight:600;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;min-height:48px}
button:disabled{opacity:.55}
#st{color:var(--mut);margin:0}
.row{display:grid;grid-template-columns:78px 1fr 44px;gap:10px;align-items:center;margin:8px 0}
.bar{height:12px;background:var(--trk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:14px;padding:6px 16px 10px}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Teste de rastreamento de mão</h1>
  <div class="cam"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
  <button id="go">Ligar câmera</button>
  <p id="st">Toque em “Ligar câmera” e permita o acesso.</p>
  <div class="card" id="f"></div>
  <small>Valores de 0° (dedo dobrado) a 180° (dedo esticado): são os ângulos que irão para os servos.</small>
</main>
<script type="module">
import {HandLandmarker,FilesetResolver,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const BASE="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const $=id=>document.getElementById(id);
const v=$("v"),c=$("c"),ctx=c.getContext("2d"),st=$("st"),go=$("go");
const names=["Polegar","Indicador","Médio","Anelar","Mindinho"];
const joints=[[2,3,4],[5,6,8],[9,10,12],[13,14,16],[17,18,20]];
$("f").innerHTML=names.map((n,i)=>`<div class="row"><span>${n}</span><div class="bar"><i id="b${i}"></i></div><span class="num" id="n${i}">–</span></div>`).join("");
const smooth=[0,0,0,0,0];
const angle=(a,b,d)=>{
  const u=[a.x-b.x,a.y-b.y,a.z-b.z],w=[d.x-b.x,d.y-b.y,d.z-b.z];
  const dot=u[0]*w[0]+u[1]*w[1]+u[2]*w[2];
  return Math.acos(Math.max(-1,Math.min(1,dot/(Math.hypot(...u)*Math.hypot(...w)))))*180/Math.PI;
};
function show(i,val){
  smooth[i]=smooth[i]*.6+val*.4;
  const r=Math.round(smooth[i]);
  $("b"+i).style.width=(r/180*100)+"%";
  $("n"+i).textContent=r+"°";
}
async function createLandmarker(fs){
  const mk=d=>HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:"VIDEO",numHands:1});
  try{return await mk("GPU");}catch(e){return await mk("CPU");}
}
go.onclick=async()=>{
  go.disabled=true;
  try{
    st.textContent="Abrindo a câmera…";
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480},audio:false});
    await v.play();
    st.textContent="Carregando o modelo de mão (alguns segundos)…";
    const lm=await createLandmarker(await FilesetResolver.forVisionTasks(BASE));
    const draw=new DrawingUtils(ctx);
    let last=-1;
    const loop=()=>{
      if(v.videoWidth&&v.currentTime!==last){
        last=v.currentTime;
        c.width=v.videoWidth;c.height=v.videoHeight;
        const res=lm.detectForVideo(v,performance.now());
        ctx.clearRect(0,0,c.width,c.height);
        const h=res.landmarks[0];
        if(h){
          draw.drawConnectors(h,HandLandmarker.HAND_CONNECTIONS,{color:"#3ecf9b",lineWidth:3});
          draw.drawLandmarks(h,{color:"#ffffff",radius:3});
          joints.forEach((j,i)=>{
            const a=angle(h[j[0]],h[j[1]],h[j[2]]);
            show(i,Math.max(0,Math.min(1,(a-70)/100))*180);
          });
          st.textContent="Mão detectada.";
        }else st.textContent="Nenhuma mão detectada. Mostre a palma para a câmera.";
      }
      requestAnimationFrame(loop);
    };
    loop();
    go.textContent="Câmera ligada";
  }catch(e){
    st.textContent="Erro: "+(e.message||e)+". Verifique a permissão da câmera e a conexão com a internet.";
    go.disabled=false;
  }
};
</script>
</body>
</html>
